<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>E-commerce</title>
</head>

<body>

    <div class="wrapper">
        <header class="header-mobile">
            <h1 class="logo">E-commerce</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>
        <aside>
             <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            <header>
                <h1 class="logo">E-commerce</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <button id="todos" class="btn-menu boton-categoria active"><i
                                class="bi bi-hand-index-thumb-fill"></i>Todos
                            los Productos</button>
                    </li>
                    <li>
                        <button id="abrigos" class="btn-menu boton-categoria"><i
                                class="bi bi-hand-index-thumb"></i>Abrigos</button>
                    </li>
                    <li>
                        <button id="camisetas" class="btn-menu boton-categoria"><i
                                class="bi bi-hand-index-thumb"></i>Camisetas</button>
                    </li>
                    <li>
                        <button id="pantalones" class="btn-menu boton-categoria"><i
                                class="bi bi-hand-index-thumb"></i>Pantalones</button>
                    </li>
                    <li>
                        <a class="btn-menu boton-carrito" href="./carrito.html">
                            <i class="bi bi-cart-fill"></i>Carrito <span id="numerito" class="numerito">0</span></a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">©2025 Pablo Paez</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos">
                <!-- Se rellena con Js -->
            </div>
        </main>

    </div>

    <script src="./js/main.js"></script>
    <script src="./js/menu.js"></script>
</body>

</html>
